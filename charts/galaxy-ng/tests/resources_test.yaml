suite: other resources
tests:
  - it: lets the cluster pick the StorageClass by default
    template: pvc.yaml
    asserts:
      - notExists:
          path: spec.storageClassName
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteMany

  - it: uses the given StorageClass
    template: pvc.yaml
    set:
      pvcBackend.storageClassName: example-rwx
    asserts:
      - equal:
          path: spec.storageClassName
          value: example-rwx

  - it: writes the admin Secret as stringData
    template: secret-admin-password.yaml
    set:
      adminPassword: example
    asserts:
      - equal:
          path: stringData
          value:
            user: admin
            password: example

  - it: creates no admin Secret by default
    template: secret-admin-password.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the web -> api and web -> content policies
    template: networkpolicies.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: api-from-web
        documentIndex: 0
      - equal:
          path: metadata.name
          value: content-from-web
        documentIndex: 1

  - it: renders no NetworkPolicy when disabled
    template: networkpolicies.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
