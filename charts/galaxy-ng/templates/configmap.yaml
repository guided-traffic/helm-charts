---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxy-ng-cm
data:
  settings.py: |-
    import os
{{- if .Values.ldap.enabled }}
    # https://galaxyng.netlify.app/integration/ldap/
    import ldap
    from django_auth_ldap.config import LDAPSearch, NestedGroupOfNamesType
{{- end }}

    CONTENT_ORIGIN = 'https://{{ .Values.ingress.domain }}'
    ANSIBLE_API_HOSTNAME = 'https://{{ .Values.ingress.domain }}'
    ANSIBLE_CONTENT_HOSTNAME = 'https://{{ .Values.ingress.domain }}/pulp/content'
    TOKEN_AUTH_DISABLED = True
    CSRF_TRUSTED_ORIGINS = ['https://{{ .Values.ingress.domain }}']
    CORS_ORIGIN_WHITELIST = ['https://{{ .Values.ingress.domain }}']
    GALAXY_REQUIRE_CONTENT_APPROVAL = False

    AUTHENTICATION_BACKEND_PRESET = 'custom'
    AUTHENTICATION_BACKENDS = [
{{- if .Values.ldap.enabled }}
      "django_auth_ldap.backend.LDAPBackend",
{{- end }}
      "django.contrib.auth.backends.ModelBackend",
      "pulpcore.backends.ObjectRolePermissionBackend",
    ]
{{- if .Values.ldap.enabled }}

    GALAXY_LDAP_LOGGING = True
    {{- .Values.ldap.settings | nindent 4 }}
    AUTH_LDAP_BIND_PASSWORD = os.getenv('AUTH_LDAP_BIND_PASSWORD')
{{- end }}

    DATABASES = {
      "default": {
        "HOST": "{{ .Values.database.host }}",
        "ENGINE": "django.db.backends.postgresql",
        "NAME": "{{ .Values.database.name }}",
        "PORT": "{{ .Values.database.port }}",
{{- if .Values.database.secret_name }}
        "USER": open('/etc/pulp/db-credentials/username').read().strip(),
{{- else if .Values.database.username }}
        "USER": "{{ .Values.database.username }}",
{{- else }}
{{- fail "Error: either database.secret_name or database.username must be set" }}
{{- end }}
{{- if .Values.database.secret_name }}
        "PASSWORD": open('/etc/pulp/db-credentials/password').read().strip(),
{{- else if .Values.database.password }}
        "PASSWORD": "{{ .Values.database.password }}",
{{- else }}
{{- fail "Error: either database.secret_name or database.password must be set" }}
{{- end }}
        "CONN_MAX_AGE": 0,
        "OPTIONS": {
          "sslmode": "prefer"
        }
      }
    } # end of DATABASE

    # S3 Backend
{{- if .Values.s3_backend.enabled }}
    DEFAULT_FILE_STORAGE = "storages.backends.s3boto3.S3Boto3Storage"
    AWS_ACCESS_KEY_ID= open('/etc/pulp/s3-credentials/access-key-id').read().strip()
    AWS_SECRET_ACCESS_KEY= open('/etc/pulp/s3-credentials/secret-access-key').read().strip()
    AWS_STORAGE_BUCKET_NAME= "{{ .Values.s3_backend.bucket_name }}"
    MEDIA_ROOT= ""
    AWS_S3_REGION_NAME= "{{ .Values.s3_backend.region }}"
    AWS_S3_ENDPOINT_URL = "{{ .Values.s3_backend.endpoint }}"
{{- end }}

    # Redis
{{- if .Values.redis.enabled }}
    CACHE_ENABLED = True
    REDIS_HOST = "{{ .Values.redis.host }}"
    REDIS_PORT = "{{ .Values.redis.port }}"
    REDIS_DB = {{ .Values.redis.db }}
    REDIS_PASSWORD = os.getenv('REDIS_PASSWORD')
{{- if .Values.redis.tls.enabled }}
    REDIS_SSL = True
{{- with include "galaxy-ng.redisCaCerts" . }}
    REDIS_SSL_CA_CERTS = '{{ . }}'
{{- end }}
{{- else }}
    REDIS_SSL = False
{{- end }}
{{- end }}

    {{ .Values.additionalSettings  | nindent 4 }}
