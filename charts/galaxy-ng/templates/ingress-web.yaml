{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaxy-ng-internal
{{- if .Values.ingress.extraLabels }}
  labels:
{{ toYaml ( .Values.ingress.extraLabels ) | indent 4 }}
{{- end }}
  annotations:
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: 600
    # nginx.ingress.kubernetes.io/proxy-send-timeout: 600
    # nginx.ingress.kubernetes.io/client_body_buffer_size: 100m
{{- if .Values.ingress.extraAnnotations }}
{{ toYaml ( .Values.ingress.extraAnnotations ) | indent 4 }}
{{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
{{- if .Values.ingress.tlsSecret }}
  tls:
  - hosts:
    - {{ .Values.ingress.domain }}
    secretName: {{ .Values.ingress.tlsSecret }}
{{- end}}
  rules:
  - host: {{ .Values.ingress.domain }}
    http:
      paths:
      - path: "/"
        pathType: "Prefix"
        backend:
          service:
            name: galaxy-ng-web-svc
            port:
              number: 8080
{{- end }}